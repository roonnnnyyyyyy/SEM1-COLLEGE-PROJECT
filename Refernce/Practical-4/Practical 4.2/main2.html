<!DOCTYPE html>
<html>
<head>
<title>Fluid Layout</title>
<link rel="stylesheet" href="main2.css">
</head>
<body>
<div class="header">
  <h1>Fluid Layout</h1>
</div>

<div class="container">
  <div class="main">
    <h2>Main Content</h2>
    <p>This area takes up a fluid 68% of the container width. Shrink the browser to see it adjust automatically.</p>
  </div>
  
  <div class="sidebar">
    <h2>Sidebar</h2>
    <p>This takes up a fluid 28% of the container width.</p>
  </div>
</div>

<div class="footer">
  <p>Fluid Footer</p>
</div>
</body>
</html>
